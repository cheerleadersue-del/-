<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="법무법인 유일">
  <!--
    검색결과와 브라우저 탭에 뜨는 작은 그림입니다.

    2026-10-27 에 법인 로고(Y 모노그램)로 바꿨습니다.
    그 전에는 저울 그림이었는데, 법인 로고가 아니라
    어느 법률사무소에나 쓰이는 그림이었습니다.

    ⚠️ 16px 로도 보여야 합니다. 그래서 assets/logo-y.svg 를
       그대로 줄이지 않고, 획을 굵게 하고 여백을 줄여 다시 잡았습니다.
       획을 더 가늘게 만들지 마십시오. 검색결과에서 뭉개집니다.

    ⚠️ 구글은 이 그림을 오래 저장해 둡니다. 바꿔도 검색결과에
       바로 반영되지 않고 몇 주 걸릴 수 있습니다.
  -->
  <rect width="64" height="64" rx="12" fill="#0d0e10"/>
  <g transform="translate(32 33) scale(0.1085) translate(-158 -188)">
    <g stroke="#c9ad78" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M30 8 L130 160 L130 367" stroke-width="72"/>
      <path d="M286 8 L192 156 L192 367" stroke-width="48"/>
    </g>
  </g>
</svg>
