[build]
  publish = "."

# =====================================================================
#  옛 도메인을 새 주소로 넘긴다 (301)
#
#  2026-09-24. 두 도메인의 등록 명의를 법무법인 유일로 넘겨받았다.
#  그중 하나만 넘긴다.
#
#    법무법인유일.com      → yuillawfirm.com 의 같은 자리   (넘긴다)
#    교통형사전문로펌.com   → 예전 서버 그대로              (안 넘긴다)
#
#  교통형사 쪽을 넘기지 않는 이유는 아래 따로 적었다.
#
#  한글 주소는 퓨니코드(xn--…)로 적는다. 넷리파이가 읽는 형태다.
#
#  301 인 이유. 검색엔진에게 "이 주소는 영영 저리로 옮겼다"고
#  알려주는 신호다. 그래야 옛 주소가 몇 해 동안 쌓아둔 것이
#  새 주소로 넘어온다. 302(임시)로 하면 넘어오지 않는다.
#
#  force = true 인 이유. 이 사이트에 같은 이름의 파일이 있어도
#  파일보다 이 규칙을 먼저 적용하라는 뜻이다. 없으면 옛 주소로
#  들어온 분이 여기 올라와 있는 사본을 그대로 보게 되어
#  같은 내용이 두 주소에 떠 있는 상태가 된다.
#
#  ⚠️ 이 규칙은 넷리파이에 그 도메인을 붙여야 작동한다.
#     Netlify → Domain management → Add domain alias 로 두 주소를
#     더하고, 가비아 DNS 에서 그 도메인을 넷리파이 쪽으로 돌린다.
#     붙이기 전에는 아무 일도 일어나지 않는다(해롭지도 않다).
#
#  ⚠️ 넘기기 전에 가비아의 지금 DNS 레코드를 사진으로 남겨두십시오.
#     특히 MX(메일)가 있으면 그대로 옮겨 적어야 메일이 끊기지 않는다.
# =====================================================================

[[redirects]]
  from = "https://xn--v92b7yba019htmaza.com/*"
  to = "https://yuillawfirm.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.xn--v92b7yba019htmaza.com/*"
  to = "https://yuillawfirm.com/:splat"
  status = 301
  force = true

# 교통형사전문로펌.com 은 넘기지 않는다.
#
# 2026-09-24. 잠깐 301 을 걸어두었다가 뺐다. 대표변호사님 말씀으로
# 그 사이트를 예전 그대로 두기로 했다. 그 도메인은 예전 서버를
# 계속 가리키고, 새 홈페이지의 교통형사 센터(traffic.html)에서
# 그리로 나가는 배너를 둔다.
#
# ⚠️ 그래서 여기에 그 도메인의 301 을 다시 넣으면 안 된다.
#    넣는 순간 traffic.html 의 배너가 제자리를 맴돈다.
#
# 나중에 그 사이트를 접기로 하시면 아래 네 줄을 되살리면 된다.
#
#   [[redirects]]
#     from = "https://xn--9d0bn3sz9bs7hu8jjtol6ch2g.com/*"
#     to = "https://yuillawfirm.com/traffic.html"
#     status = 301
#     force = true
#
#   www 도 같은 모양으로 한 벌 더.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# publish = "." 이라 저장소 파일이 그대로 웹에 노출된다.
# 코드와 설정 문서는 못 보게 막는다.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404

# 아직 공개하지 않은 초안. 배포에서 빼지만 혹시 몰라 한 번 더 막는다.
[[redirects]]
  from = "/_draft/*"
  to = "/404.html"
  status = 404

# HTML 은 항상 최신본을 받아야 하므로 캐시하지 않는다.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 사진과 그림을 캐시하는 기간.
#
# 전에는 1년 immutable 이었다. 파일 이름에 내용을 나타내는 표식이
# 자동으로 붙는 사이트라면 그것이 맞다. 이 사이트는 손으로 이름을 적으므로
# 같은 이름에 다른 사진을 덮어쓰는 일이 실제로 일어난다.
# lawyer-01.webp 과 lawyer-01-portrait.webp 이 2026-09-07 에 그렇게
# 바뀌었다. 1년 immutable 이면 그 전에 다녀간 분의 브라우저는 1년 동안
# 옛 사진을 붙들고 다시 묻지도 않는다.
#
# (깃허브 페이지스는 이 파일을 읽지 않는다. 거기서는 깃허브가 정한
#  훨씬 짧은 기간이 쓰이므로 이 문제가 생기지 않는다.
#  이 규칙은 넷리파이에만 걸린다.)
#
# 그래서 하루로 줄인다. 사진을 바꾸시면 늦어도 하루 안에 모두에게 반영된다.
# 급히 반영해야 하면 지금처럼 파일 이름 끝에 -v2, -v3 을 붙이십시오.
# 그 방법은 캐시를 기다릴 것 없이 그 자리에서 듣는다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
