[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# publish = "." 이라 저장소 파일이 그대로 웹에 노출된다.
# 코드와 설정 문서는 못 보게 막는다.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404

# HTML 은 항상 최신본을 받아야 하므로 캐시하지 않는다.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 사진과 그림을 캐시하는 기간.
#
# 전에는 1년 immutable 이었다. 파일 이름에 내용을 나타내는 표식이
# 자동으로 붙는 사이트라면 그것이 맞다. 이 사이트는 손으로 이름을 적으므로
# 같은 이름에 다른 사진을 덮어쓰는 일이 실제로 일어난다.
# 그러면 그 전에 한 번이라도 다녀간 분의 브라우저는 1년 동안 옛 사진을
# 붙들고 다시 묻지도 않는다(대표변호사 사진이 그렇게 되었다).
#
# 그래서 하루로 줄인다. 사진을 바꾸시면 늦어도 하루 안에 모두에게 반영된다.
# 급히 반영해야 하면 지금처럼 파일 이름 끝에 -v2, -v3 을 붙이십시오.
# 그 방법은 캐시를 기다릴 것 없이 그 자리에서 듣는다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
